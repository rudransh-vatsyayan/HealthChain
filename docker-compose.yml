version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: healthchain-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthchain-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/healthchain
      - JWT_SECRET=healthchainsecret
      - FRONTEND_URL=http://localhost:5173
      - USE_MEMORY_DB=false
      - SEED_RESET=false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthchain-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
